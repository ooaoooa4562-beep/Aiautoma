services:
  - type: web
    name: telegram-ai-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AUTO_REPLY
        value: "false"
      - key: AI_PROVIDER_ORDER
        value: "groq,openrouter"
      - key: DB_PATH
        value: "data/assistant.sqlite3"
      - key: MAX_HISTORY
        value: "12"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
